<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="aluminum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)"/>
  <ellipse cx="200" cy="240" rx="120" ry="12" fill="#CBD5E1" opacity="0.6"/>
  <!-- Hub body -->
  <g filter="url(#shadow2)">
    <rect x="130" y="110" width="140" height="70" rx="10" fill="url(#aluminum)"/>
    <rect x="132" y="112" width="136" height="66" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1" opacity="0.4"/>
    <!-- Status LED -->
    <circle cx="150" cy="145" r="3" fill="#10B981"/>
    <!-- Ports -->
    <rect x="170" y="138" width="22" height="14" rx="2" fill="#0F172A"/>
    <rect x="172" y="142" width="18" height="3" fill="#38BDF8"/>
    <rect x="202" y="138" width="22" height="14" rx="2" fill="#0F172A"/>
    <rect x="204" y="142" width="18" height="3" fill="#38BDF8"/>
    <rect x="234" y="140" width="18" height="10" rx="2" fill="#0F172A"/>
  </g>
  <!-- Cable -->
  <path d="M 270 145 C 330 145, 330 80, 270 70" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- USB-C connector -->
  <rect x="245" y="63" width="26" height="14" rx="4" fill="#64748B" filter="url(#shadow2)"/>
  <rect x="235" y="66" width="10" height="8" rx="2" fill="#94A3B8"/>
</svg>
