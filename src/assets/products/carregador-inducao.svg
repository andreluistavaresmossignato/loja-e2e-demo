<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg3)"/>
  <ellipse cx="200" cy="225" rx="110" ry="16" fill="#CBD5E1" opacity="0.6"/>
  <!-- Base pad ellipse 3D effect -->
  <g filter="url(#shadow3)">
    <ellipse cx="200" cy="165" rx="85" ry="50" fill="#334155"/>
    <ellipse cx="200" cy="160" rx="85" ry="50" fill="url(#padGrad)"/>
    <ellipse cx="200" cy="160" rx="82" ry="47" fill="none" stroke="#4F46E5" stroke-width="2" opacity="0.8"/>
    <!-- Charging symbol -->
    <path d="M 202 142 L 194 160 L 202 160 L 198 178 L 210 158 L 202 158 Z" fill="#6366F1"/>
    <!-- Subtle LED light ring -->
    <ellipse cx="200" cy="160" rx="60" ry="32" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
  </g>
</svg>
